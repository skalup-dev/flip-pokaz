<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip</title>
<style>
:root{--k:#f4f1ea;--c:#1E1A17;--z:#B8924A}
*{box-sizing:border-box}
body{margin:0;background:var(--k);color:var(--c);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--c);background:var(--k);border:1px solid var(--c);border-radius:8px;padding:10px;width:100%}
label{display:block;font-weight:600;margin:10px 0 4px}
label small{font-weight:400}
.top{position:sticky;top:0;z-index:20;background:var(--c);color:var(--k);display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-weight:700;letter-spacing:.5px;color:var(--z);font-size:18px;cursor:pointer}
.top .sp{flex:1}
.top .who{font-size:13px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45vw}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.narrow{max-width:440px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:18px;margin:16px 0 8px}
.intro{margin:0 0 14px}
.btn{background:var(--c);color:var(--z);border:none;border-radius:10px;padding:12px 14px;font-weight:600}
.btn2{background:transparent;color:var(--c);border:1px solid var(--c);border-radius:10px;padding:11px 14px;font-weight:600}
.btnT{background:none;border:none;color:var(--c);text-decoration:underline;padding:6px 0}
.top .btn2{color:var(--k);border-color:var(--z);padding:6px 10px}
.full{width:100%}
.card{border:1px solid var(--z);border-radius:12px;padding:14px;margin-bottom:10px}
.card.dark{background:var(--c);color:var(--k);border-color:var(--c)}
.grid{display:grid;gap:10px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.kpi small{display:block;font-size:12px}.kpi div{font-weight:700;font-size:19px}
.flat{cursor:pointer;display:block;width:100%;text-align:left;background:transparent;color:var(--c)}
.flat b{font-size:17px}
.flat .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;margin-top:4px}
.late{font-weight:700}
.late::before{content:"! ";display:inline-block;background:var(--c);color:var(--k);border-radius:50%;width:17px;height:17px;text-align:center;line-height:17px;font-size:12px;margin-right:4px}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--z)}
.row:last-child{border-bottom:none}
.msg{border:2px solid var(--c);border-radius:10px;padding:10px;margin:10px 0;font-weight:600}
.msg.info{border-color:var(--z)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts > *{flex:1;min-width:140px}
.hide{display:none!important}
.empty{text-align:center;padding:28px 14px}
.load{opacity:.6;pointer-events:none}
.logo{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btn2{flex:none;white-space:nowrap}
.stopka{text-align:center;font-size:13px;padding:18px 16px 24px}
.stopka b{color:var(--z)}
@media (max-width:480px){.top .who{display:none}.top{gap:8px;padding:10px 12px}.logo{font-size:16px}.top .btn2{padding:6px 8px}}
@media (max-width:640px){.g3{grid-template-columns:1fr 1fr}.g3 .kpi:last-child{grid-column:1/-1}.g2{grid-template-columns:1fr}}
/* ---------- Biblioteka ---------- */
.btnBib{font-size:17px;padding:14px;margin-bottom:12px}
.fold{display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;background:transparent;color:var(--c)}
.fold .ik{flex:none;width:44px;height:36px;border-radius:6px 6px 8px 8px;background:#B8924A;position:relative}
.fold .ik::before{content:"";position:absolute;left:0;top:-6px;width:20px;height:8px;border-radius:4px 4px 0 0;background:#B8924A}
.fold .ik::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;border-radius:4px 4px 8px 8px;background:#C9A660}
.fold .tx{flex:1;min-width:0}
.fold .tx b{font-size:17px;display:block}
.fold .tx small{display:block;font-size:13px}
.fold .str{flex:none;font-size:22px;color:var(--z);font-weight:700}
.sciezka{font-size:13px;margin:0 0 4px}
.wgraj{display:block;text-align:center;cursor:pointer}
.files{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.plik{border:1px solid var(--z);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.plik .mini{display:block;width:100%;aspect-ratio:4/3;border:none;padding:0;cursor:pointer;background:var(--c);overflow:hidden}
.plik .mini img{width:100%;height:100%;object-fit:cover;display:block}
.plik .mini .pdf{display:flex;height:100%;align-items:center;justify-content:center;color:var(--z);font-weight:700;font-size:26px;letter-spacing:1px}
.plik .opis{padding:10px;flex:1;display:flex;flex-direction:column;gap:6px}
.plik .opis b{font-size:14px;word-break:break-word}
.plik .opis small{font-size:12px}
.plik .opis .acts{margin-top:4px}
.plik .opis .acts > *{min-width:0;padding:8px 10px}
.okno{position:fixed;inset:0;z-index:50;background:rgba(30,26,23,.96);color:var(--k);display:flex;flex-direction:column}
.okno .gora{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--z)}
.okno .gora b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.okno .gora .btn2{color:var(--k);border-color:var(--z);padding:8px 12px}
.okno .info{padding:8px 16px;font-size:13px}
.okno .tresc{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px 16px;gap:12px}
.okno .tresc img{max-width:100%;max-height:100%;object-fit:contain}
.okno .tresc iframe{flex:1;width:100%;border:none;background:var(--k);border-radius:8px}
.okno .tresc a.btn{text-decoration:none;text-align:center}
@media (max-width:700px){.okno .tresc iframe{display:none}.files{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top">
  <span class="logo" id="logo">FLIP</span><span class="sp"></span>
  <span class="who hide" id="who"></span>
  <button class="btn2 hide" id="mojeDane">Moje dane</button>
  <button class="btn2 hide" id="wyloguj">Wyloguj</button>
</div>
<div class="wrap" id="app"></div>
<div class="stopka">Aplikacja <b>Flip</b></div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zl = n => n == null ? '–' : new Intl.NumberFormat('pl-PL',{maximumFractionDigits:2}).format(n).replace(/ /g,' ') + ' zł';
const m2 = n => n == null ? '–' : new Intl.NumberFormat('pl-PL',{maximumFractionDigits:2}).format(n).replace(/ /g,' ') + ' m²';
const dt = d => d ? d.split('-').reverse().join('.') : '–';
const dzis = () => new Date().toISOString().slice(0,10);
const liczba = v => { v = String(v).trim().replace(/\s/g,'').replace(',','.'); if (!v) return null; const n = Number(v); return isNaN(n) ? NaN : n; };

const BLEDY = {
  'Invalid login credentials':'Zły e-mail albo hasło.',
  'Email not confirmed':'Konto nie jest jeszcze potwierdzone. Trzeba kliknąć link w mailu, który przyszedł po rejestracji.',
  'User already registered':'Konto z tym e-mailem już istnieje. Można się zalogować albo użyć „Nie pamiętam hasła”.',
  'Password should be at least 6 characters':'Hasło musi mieć co najmniej 8 znaków.',
  'Failed to fetch':'Brak połączenia z internetem. Trzeba spróbować ponownie.',
  'Unable to validate email address: invalid format':'Ten e-mail ma zły format.'
};
const blad = e => { const m = (e && (e.message || e.error_description)) || String(e); for (const k in BLEDY) if (m.includes(k)) return BLEDY[k]; if (/rate limit/i.test(m)) return 'Za dużo prób. Trzeba odczekać chwilę i spróbować ponownie.'; return 'Coś poszło nie tak: ' + m; };

const S = { user:null, flats:[], tryb:'logowanie', profil:null };
const kto = () => (S.profil && S.profil.imie && S.profil.imie.trim()) || 'Właściciel aplikacji';
let sb = null;

function komunikat(txt, info){ return `<div class="msg ${info?'info':''}" role="alert">${esc(txt)}</div>`; }

/* ---------- start ---------- */
function start(){
  const cfg = window.FLIP_CFG || {};
  if (!cfg.url || !cfg.key || !window.supabase){
    app.innerHTML = `<div class="narrow" style="margin:auto"><h1>Aplikacja nie jest jeszcze podłączona</h1>
      <p class="intro">Brakuje połączenia z bazą danych. Gdy zostanie podłączona, tutaj pojawi się logowanie.</p></div>`;
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.key);
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY'){ S.recovery = true; S.user = session?.user || null; pasek(); ekranNoweHaslo(); return; }
    const u = session?.user || null;
    const zmiana = (u?.id || null) !== (S.user?.id || null);
    S.user = u; pasek();
    if (zmiana || (ev === 'INITIAL_SESSION' && !u)) u ? wczytaj() : ekranLogowania();
  });
}

function pasek(){
  const firma = S.user && S.profil && S.profil.nazwa_firmy && S.profil.nazwa_firmy.trim();
  $('#logo').textContent = firma || 'FLIP';
  $('#logo').title = firma || '';
  $('#mojeDane').classList.toggle('hide', !S.user || !!S.recovery);
  $('#who').textContent = S.user ? S.user.email : '';
  $('#who').classList.toggle('hide', !S.user);
  $('#wyloguj').classList.toggle('hide', !S.user);
}
$('#wyloguj').onclick = async () => { await sb.auth.signOut(); S.flats = []; S.profil = null; pasek(); };
$('#mojeDane').onclick = () => ekranMojeDane();
$('#logo').onclick = () => S.user ? ekranListy() : ekranLogowania();

/* ---------- logowanie ---------- */
function ekranLogowania(msg, info){
  const t = S.tryb;
  const tytul = {logowanie:'Logowanie', rejestracja:'Zakładanie konta', reset:'Nie pamiętam hasła'}[t];
  const opis = {
    logowanie:'Logowanie do aplikacji Flip. Po zalogowaniu otworzy się lista mieszkań.',
    rejestracja:'Tu zakłada się konto Właściciela aplikacji. Po założeniu przyjdzie mail z linkiem do potwierdzenia, a potem będzie można się zalogować.',
    reset:'Trzeba wpisać e-mail konta. Przyjdzie mail z linkiem, a po jego kliknięciu będzie można ustawić nowe hasło.'
  }[t];
  app.innerHTML = `<div class="narrow" style="margin:auto">
    <h1>${tytul}</h1><p class="intro">${opis}</p>
    ${msg ? komunikat(msg, info) : ''}
    <form id="f" novalidate>
      ${t==='rejestracja' ? `<label for="imie">Imię</label><input id="imie" autocomplete="given-name">` : ''}
      <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required>
      ${t!=='reset' ? `<label for="haslo">Hasło ${t==='rejestracja'?'<small>(co najmniej 8 znaków)</small>':''}</label>
        <input id="haslo" type="password" autocomplete="${t==='rejestracja'?'new-password':'current-password'}" required>` : ''}
      ${t==='rejestracja' ? `<label for="haslo2">Hasło jeszcze raz</label><input id="haslo2" type="password" autocomplete="new-password">` : ''}
      <button class="btn full" style="margin-top:16px" id="wyslij">${{logowanie:'Zaloguj',rejestracja:'Załóż konto',reset:'Wyślij link'}[t]}</button>
    </form>
    <div style="margin-top:12px">
      ${t!=='logowanie' ? `<button class="btnT" data-t="logowanie">Mam konto – zaloguj się</button><br>` : ''}
      ${t!=='rejestracja' ? `<button class="btnT" data-t="rejestracja">Nie masz konta? Załóż konto</button><br>` : ''}
      ${t!=='reset' ? `<button class="btnT" data-t="reset">Nie pamiętam hasła</button>` : ''}
    </div></div>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.tryb = b.dataset.t; ekranLogowania(); });
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const email = $('#email').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return ekranLogowaniaZ('Trzeba wpisać poprawny e-mail.');
    const f = $('#f'); f.classList.add('load');
    try{
      if (t === 'logowanie'){
        const haslo = $('#haslo').value;
        if (!haslo) { f.classList.remove('load'); return ekranLogowaniaZ('Trzeba wpisać hasło.', email); }
        const { error } = await sb.auth.signInWithPassword({ email, password: haslo });
        if (error) throw error;
      } else if (t === 'rejestracja'){
        const haslo = $('#haslo').value, h2 = $('#haslo2').value, imie = $('#imie').value.trim();
        if (haslo.length < 8) { f.classList.remove('load'); return ekranLogowaniaZ('Hasło musi mieć co najmniej 8 znaków.', email, imie); }
        if (haslo !== h2) { f.classList.remove('load'); return ekranLogowaniaZ('Hasła nie są takie same.', email, imie); }
        const { data, error } = await sb.auth.signUp({ email, password: haslo, options:{ data:{ imie }, emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (!data.session){ S.tryb = 'logowanie'; ekranLogowania('Konto założone. Na skrzynkę ' + email + ' przyszedł mail z linkiem. Po kliknięciu linku można się tutaj zalogować.', true); }
      } else {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        if (error) throw error;
        S.tryb = 'logowanie'; ekranLogowania('Jeśli konto istnieje, na ' + email + ' przyszedł mail z linkiem do zmiany hasła.', true);
      }
    } catch(err){ f.classList.remove('load'); ekranLogowaniaZ(blad(err), email); }
  };
}
function ekranLogowaniaZ(msg, email, imie){ ekranLogowania(msg); if (email) $('#email').value = email; if (imie && $('#imie')) $('#imie').value = imie; }

function ekranNoweHaslo(msg){
  app.innerHTML = `<div class="narrow" style="margin:auto"><h1>Ustawianie nowego hasła</h1>
    <p class="intro">Tu ustawia się nowe hasło do konta. Po zapisaniu otworzy się lista mieszkań.</p>${msg?komunikat(msg):''}
    <form id="f"><label for="haslo">Nowe hasło <small>(co najmniej 8 znaków)</small></label><input id="haslo" type="password" autocomplete="new-password">
    <label for="haslo2">Hasło jeszcze raz</label><input id="haslo2" type="password" autocomplete="new-password">
    <button class="btn full" style="margin-top:16px">Zapisz nowe hasło</button></form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const h = $('#haslo').value;
    if (h.length < 8) return ekranNoweHaslo('Hasło musi mieć co najmniej 8 znaków.');
    if (h !== $('#haslo2').value) return ekranNoweHaslo('Hasła nie są takie same.');
    const { error } = await sb.auth.updateUser({ password: h });
    if (error) return ekranNoweHaslo(blad(error));
    S.recovery = false; pasek(); wczytaj('Nowe hasło zapisane.');
  };
}

/* ---------- mieszkania ---------- */
async function wczytaj(msg){
  app.innerHTML = '<p>Wczytuję mieszkania…</p>';
  const [{ data, error }, pr] = await Promise.all([ sb.from('mieszkania').select('*'), sb.from('profile').select('*').eq('id', S.user.id) ]);
  S.profil = (pr && pr.data && pr.data[0]) || null; pasek();
  if (error){ app.innerHTML = komunikat(blad(error)) + '<button class="btn" id="ponow">Spróbuj ponownie</button>'; $('#ponow').onclick = () => wczytaj(); return; }
  S.flats = (data || []).sort((a,b) => a.ulica.localeCompare(b.ulica, 'pl', {numeric:true}));
  ekranListy(msg);
}

const spozn = f => f.termin_konca && f.termin_konca < dzis();

function ekranListy(msg){
  if (S.recovery) return;
  const fl = S.flats;
  const budzet = fl.reduce((s,f) => s + (Number(f.budzet) || 0), 0);
  const late = fl.filter(spozn).length;
  app.innerHTML = `<h1>Moje mieszkania</h1>
    <p class="intro">${esc(kto())} ma tu wszystkie swoje mieszkania, zapisane na stałe. ${esc(kto())} klika mieszkanie, żeby zobaczyć szczegóły, albo dodaje nowe.</p>
    ${msg ? komunikat(msg, true) : ''}
    <div class="grid g3" style="margin-bottom:12px">
      <div class="card dark kpi"><small>Mieszkania</small><div id="kpiN">${fl.length}</div></div>
      <div class="card dark kpi"><small>Budżet razem</small><div id="kpiB">${zl(budzet)}</div></div>
      <div class="card dark kpi"><small>Po terminie</small><div id="kpiL">${late}</div></div>
    </div>
    <button class="btn full" id="dodaj" style="margin-bottom:14px">+ Dodaj mieszkanie</button>
    <div id="lista">${fl.length ? fl.map(f => `
      <button class="card flat" data-id="${f.id}">
        <b>${esc(f.ulica)}</b>${f.miasto ? `, ${esc(f.miasto)}` : ''}
        <div class="meta"><span>Metraż: ${m2(f.metraz)}</span><span>Budżet: ${zl(f.budzet)}</span>
        <span class="${spozn(f)?'late':''}">Termin końca: ${dt(f.termin_konca)}${spozn(f)?' – po terminie':''}</span></div>
      </button>`).join('') : `<div class="card empty"><b>Nie ma jeszcze żadnego mieszkania.</b><br>Po kliknięciu „Dodaj mieszkanie” można dodać pierwsze.</div>`}</div>`;
  $('#dodaj').onclick = () => ekranFormularza();
  app.querySelectorAll('.flat').forEach(b => b.onclick = () => ekranMieszkania(b.dataset.id));
}

function ekranMieszkania(id, msg){
  const f = S.flats.find(x => x.id === id); if (!f) return ekranListy();
  app.innerHTML = `<button class="btnT" id="wroc">← Moje mieszkania</button>
    <h1>${esc(f.ulica)}</h1><p class="intro">Dane mieszkania. Po kliknięciu „Biblioteka” ${esc(kto())} wgrywa albo ogląda zdjęcia i pliki PDF tego mieszkania. ${esc(kto())} może też zmienić dane albo usunąć mieszkanie.</p>
    ${msg ? komunikat(msg, true) : ''}
    <button class="btn full btnBib" id="biblioteka">Biblioteka – zdjęcia i pliki PDF</button>
    <div class="card">
      <div class="row"><span>Ulica i numer</span><b>${esc(f.ulica)}</b></div>
      <div class="row"><span>Miasto</span><b>${esc(f.miasto) || '–'}</b></div>
      <div class="row"><span>Firma remontowa</span><b>${esc(f.firma_remontowa) || '–'}</b></div>
      <div class="row"><span>Metraż</span><b>${m2(f.metraz)}</b></div>
      <div class="row"><span>Budżet remontu</span><b>${zl(f.budzet)}</b></div>
      <div class="row"><span>Data startu remontu</span><b>${dt(f.data_startu)}</b></div>
      <div class="row"><span>Termin końca</span><b class="${spozn(f)?'late':''}">${dt(f.termin_konca)}</b></div>
      ${f.opis ? `<div class="row"><span>Opis</span><b style="white-space:pre-wrap;text-align:right">${esc(f.opis)}</b></div>` : ''}
    </div>
    <div class="card"><b>Co będzie dalej</b><br>W kolejnych krokach dojdą tu: ${f.firma_remontowa && f.firma_remontowa.trim() ? 'Chat z firmą ' + esc(f.firma_remontowa.trim()) : 'Chat z firmą remontową'}, Lista prac, Płatności i Terminy.</div>
    <div class="acts"><button class="btn" id="zmien">Zmień dane</button><button class="btn2" id="usun">Usuń mieszkanie</button></div>`;
  $('#wroc').onclick = () => ekranListy();
  $('#biblioteka').onclick = () => ekranBiblioteki(f.id);
  $('#zmien').onclick = () => ekranFormularza(f);
  $('#usun').onclick = () => ekranUsun(f);
}

function ekranUsun(f, msg){
  app.innerHTML = `<div class="narrow" style="margin:auto"><h1>Usunąć mieszkanie?</h1>
    <p class="intro">Mieszkanie <b>${esc(f.ulica)}</b> zniknie na stałe razem z jego danymi. Tego nie da się cofnąć.</p>
    ${msg?komunikat(msg):''}
    <div class="acts"><button class="btn2" id="nie">Nie, wróć</button><button class="btn" id="tak">Tak, usuń na stałe</button></div></div>`;
  $('#nie').onclick = () => ekranMieszkania(f.id);
  $('#tak').onclick = async () => {
    $('#tak').disabled = true;
    const n = await ilePlikowMieszkania(f.id);
    if (n) return ekranUsunZablokowane(f, n);
    const { error } = await sb.from('mieszkania').delete().eq('id', f.id);
    if (error) return ekranUsun(f, blad(error));
    wczytaj('Mieszkanie ' + f.ulica + ' zostało usunięte.');
  };
}

function ekranFormularza(f, msg, wpis){
  const n = !f; const v = wpis || f || {};
  const pole = (id, txt, typ='text', extra='') => `<label for="${id}">${txt}</label><input id="${id}" type="${typ}" value="${esc(v[id] ?? '')}" ${extra}>`;
  app.innerHTML = `<button class="btnT" id="wroc">← ${n ? 'Moje mieszkania' : 'Wróć do mieszkania'}</button>
    <div class="narrow"><h1>${n ? 'Nowe mieszkanie' : 'Zmiana danych mieszkania'}</h1>
    <p class="intro">${n ? 'Tu wpisuje się dane nowego mieszkania. Po zapisaniu pojawi się ono na liście mieszkań.' : 'Tu poprawia się dane mieszkania. Po zapisaniu otworzy się znowu ekran mieszkania.'} Wymagana jest tylko ulica i numer, resztę można dopisać później.</p>
    ${msg ? komunikat(msg) : ''}
    <form id="f" novalidate>
      ${pole('ulica','Ulica i numer *','text','placeholder="np. Krasińskiego 3/4"')}
      ${pole('miasto','Miasto')}
      ${pole('firma_remontowa','Firma remontowa <small>(nieobowiązkowo)</small>','text','maxlength="80"')}
      <div class="grid g2">${pole('metraz','Metraż (m²)','text','inputmode="decimal"')}${pole('budzet','Budżet remontu (zł)','text','inputmode="decimal"')}</div>
      <div class="grid g2">${pole('data_startu','Data startu remontu','date')}${pole('termin_konca','Termin końca','date')}</div>
      <label for="opis">Opis <small>(nieobowiązkowy)</small></label><textarea id="opis" rows="3">${esc(v.opis ?? '')}</textarea>
      <button class="btn full" style="margin-top:16px" id="zapisz">${n ? 'Zapisz mieszkanie' : 'Zapisz zmiany'}</button>
    </form></div>`;
  $('#wroc').onclick = () => n ? ekranListy() : ekranMieszkania(f.id);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const w = { ulica:$('#ulica').value.trim(), miasto:$('#miasto').value.trim() || null,
      firma_remontowa:$('#firma_remontowa').value.trim() || null,
      metraz:liczba($('#metraz').value), budzet:liczba($('#budzet').value),
      data_startu:$('#data_startu').value || null, termin_konca:$('#termin_konca').value || null,
      opis:$('#opis').value.trim() || null };
    const raw = { ...w, metraz:$('#metraz').value, budzet:$('#budzet').value };
    if (!w.ulica) return ekranFormularza(f, 'Trzeba wpisać ulicę i numer.', raw);
    if (Number.isNaN(w.metraz) || (w.metraz != null && w.metraz <= 0)) return ekranFormularza(f, 'Metraż musi być liczbą większą od zera, np. 50 albo 48,5.', raw);
    if (Number.isNaN(w.budzet) || (w.budzet != null && w.budzet < 0)) return ekranFormularza(f, 'Budżet musi być liczbą, np. 120000.', raw);
    if (w.data_startu && w.termin_konca && w.termin_konca < w.data_startu) return ekranFormularza(f, 'Termin końca nie może być wcześniej niż data startu.', raw);
    $('#f').classList.add('load');
    const q = n ? sb.from('mieszkania').insert(w).select().single() : sb.from('mieszkania').update(w).eq('id', f.id).select().single();
    const { data, error } = await q;
    if (error) return ekranFormularza(f, blad(error), raw);
    if (n){ S.flats.push(data); } else { Object.assign(S.flats.find(x => x.id === f.id), data); }
    S.flats.sort((a,b) => a.ulica.localeCompare(b.ulica, 'pl', {numeric:true}));
    n ? ekranListy('Mieszkanie ' + data.ulica + ' zapisane.') : ekranMieszkania(f.id, 'Zmiany zapisane.');
  };
}

/* ---------- Moje dane ---------- */
function ekranMojeDane(msg, wpis){
  if (!S.user) return ekranLogowania();
  const v = wpis || S.profil || {};
  app.innerHTML = `<button class="btnT" id="wroc">← Moje mieszkania</button>
    <div class="narrow"><h1>Moje dane</h1>
    <p class="intro">Tu ${esc(kto())} wpisuje swoje imię i nazwę firmy. Imię pojawia się w tekstach aplikacji, a nazwa firmy na górnym pasku zamiast „FLIP”. Oba pola są nieobowiązkowe. Po zapisaniu otworzy się lista mieszkań.</p>
    ${msg ? komunikat(msg) : ''}
    <form id="f" novalidate>
      <label for="imie">Imię <small>(nieobowiązkowo)</small></label><input id="imie" maxlength="40" autocomplete="given-name" value="${esc(v.imie ?? '')}">
      <label for="nazwa_firmy">Nazwa firmy <small>(nieobowiązkowo)</small></label><input id="nazwa_firmy" maxlength="80" autocomplete="organization" value="${esc(v.nazwa_firmy ?? '')}">
      <button class="btn full" style="margin-top:16px" id="zapiszDane">Zapisz dane</button>
    </form></div>`;
  $('#wroc').onclick = () => ekranListy();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const w = { imie:$('#imie').value.trim() || null, nazwa_firmy:$('#nazwa_firmy').value.trim() || null };
    if (w.imie && w.imie.length > 40) return ekranMojeDane('Imię może mieć najwyżej 40 znaków.', w);
    if (w.nazwa_firmy && w.nazwa_firmy.length > 80) return ekranMojeDane('Nazwa firmy może mieć najwyżej 80 znaków.', w);
    $('#f').classList.add('load');
    const { data, error } = await sb.from('profile').update(w).eq('id', S.user.id).select();
    if (error) return ekranMojeDane(/nazwa_firmy|column/i.test(error.message || '') ? 'Moje dane nie są jeszcze włączone w bazie danych. Trzeba wgrać plik 03_moje_dane.sql w Supabase.' : blad(error), w);
    if (!data || !data.length) return ekranMojeDane('Nie udało się zapisać danych, bo w bazie brakuje profilu tego konta. Trzeba wgrać plik 03_moje_dane.sql w Supabase.', w);
    S.profil = data[0]; pasek();
    ekranListy('Dane zapisane.');
  };
}

/* ---------- Biblioteka ---------- */
const SCHOWEK = 'biblioteka';
const MAX_PDF = 20 * 1024 * 1024;
const FOLDERY = [
  { k:'faktury', n:'Faktury', o:'faktury za remont, materiały, notariusza, pośredników i inne', pod:[
    { k:'faktury_firma', n:'Firma remontowa', o:'faktury od firmy remontowej' },
    { k:'faktury_materialy', n:'Materiały', o:'faktury za materiały' },
    { k:'faktury_notariusz', n:'Notariusz', o:'faktury od notariusza' },
    { k:'faktury_posrednicy', n:'Pośrednicy', o:'faktury od pośredników' },
    { k:'faktury_inne', n:'Inne', o:'pozostałe faktury, które nie pasują do innych folderów', ostatni:true } ] },
  { k:'paragony', n:'Paragony', o:'paragony ze sklepów' },
  { k:'plany', n:'Plany od architekta', o:'plany mieszkania od architekta. Teraz widzi je {KTO}, później zobaczy je też firma remontowa' },
  { k:'postepy', n:'Postępy prac', o:'zdjęcia postępów remontu' },
  { k:'poprawki', n:'Poprawki', o:'zdjęcia usterek do poprawienia' },
  { k:'zdjecia', n:'Zdjęcia', o:'zdjęcia mieszkania przed remontem i po remoncie', pod:[
    { k:'zdjecia_po', n:'Po remoncie', o:'zdjęcia mieszkania po remoncie' },
    { k:'zdjecia_przed', n:'Przed remontem', o:'zdjęcia mieszkania przed remontem' } ] }
];
const alfabet = (a, b) => (a.ostatni ? 1 : 0) - (b.ostatni ? 1 : 0) || a.n.localeCompare(b.n, 'pl');
FOLDERY.sort(alfabet); FOLDERY.forEach(g => g.pod && g.pod.sort(alfabet));
const LISCIE = {}; FOLDERY.forEach(g => (g.pod || [g]).forEach(l => LISCIE[l.k] = { ...l, grupa: g.pod ? g : null }));
const kluczeGrupy = g => (g.pod || [g]).map(l => l.k);

const czas = t => { const d = new Date(t); return d.toLocaleDateString('pl-PL') + ', ' + d.toLocaleTimeString('pl-PL', {hour:'2-digit', minute:'2-digit'}); };
const wielkosc = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
const ileP = n => n + ' ' + (n === 1 ? 'plik' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'pliki' : 'plików');
const bladPliku = e => {
  const m = (e && (e.message || e.error)) || String(e);
  if (/bucket not found/i.test(m) || /relation .*pliki/i.test(m) || /Could not find the table/i.test(m)) return 'Biblioteka nie jest jeszcze włączona w bazie danych. Trzeba wgrać plik 02_biblioteka.sql w Supabase.';
  if (/mime type|not supported/i.test(m)) return 'Ten rodzaj pliku nie jest dozwolony. Można wgrywać tylko zdjęcia i pliki PDF.';
  if (/maximum allowed size|too large|Payload too large/i.test(m)) return 'Plik jest za duży. Plik PDF może mieć najwyżej 20 MB.';
  return blad(e);
};
const mieszkanie = id => S.flats.find(x => x.id === id);

function sciezkaFolderu(f, lisc){
  return `<button class="btnT" id="wrocBib">← ${lisc.grupa ? esc(lisc.grupa.n) : 'Biblioteka'}</button>
    <p class="sciezka">${esc(f.ulica)} › Biblioteka${lisc.grupa ? ' › ' + esc(lisc.grupa.n) : ''}</p>`;
}

async function ekranBiblioteki(fid, msg){
  const f = mieszkanie(fid); if (!f) return ekranListy();
  app.innerHTML = '<p>Wczytuję Bibliotekę…</p>';
  const { data, error } = await sb.from('pliki').select('folder').eq('mieszkanie', fid);
  const ile = {}; (data || []).forEach(p => ile[p.folder] = (ile[p.folder] || 0) + 1);
  app.innerHTML = `<button class="btnT" id="wroc">← Wróć do mieszkania</button>
    <h1>Biblioteka – ${esc(f.ulica)}</h1>
    <p class="intro">Tu są wszystkie zdjęcia i pliki PDF tego mieszkania, ułożone w folderach od A do Z. Po kliknięciu folder się otwiera. W folderze ${esc(kto())} wgrywa zdjęcia i pliki PDF, ogląda je i usuwa.</p>
    ${error ? komunikat(bladPliku(error)) : ''}${msg ? komunikat(msg, true) : ''}
    <div id="foldery">${FOLDERY.map(g => {
      const n = kluczeGrupy(g).reduce((s, k) => s + (ile[k] || 0), 0);
      return `<button class="card fold" data-g="${g.k}"><span class="ik"></span>
        <span class="tx"><b>${esc(g.n)}</b><small>${g.pod ? 'Podfoldery: ' + g.pod.map(l => esc(l.n)).join(', ') + ' · ' : ''}${ileP(n)}</small></span><span class="str">›</span></button>`;
    }).join('')}</div>`;
  $('#wroc').onclick = () => ekranMieszkania(fid);
  app.querySelectorAll('.fold').forEach(b => b.onclick = () => {
    const g = FOLDERY.find(x => x.k === b.dataset.g);
    g.pod ? ekranPodfolderow(fid, g.k, ile) : ekranFolderu(fid, g.k);
  });
}

async function ekranPodfolderow(fid, gk, ile){
  const f = mieszkanie(fid); if (!f) return ekranListy();
  const g = FOLDERY.find(x => x.k === gk);
  if (!ile){
    app.innerHTML = '<p>Wczytuję folder…</p>';
    const { data } = await sb.from('pliki').select('folder').eq('mieszkanie', fid);
    ile = {}; (data || []).forEach(p => ile[p.folder] = (ile[p.folder] || 0) + 1);
  }
  app.innerHTML = `<button class="btnT" id="wrocBib">← Biblioteka</button>
    <p class="sciezka">${esc(f.ulica)} › Biblioteka</p>
    <h1>${esc(g.n)}</h1>
    <p class="intro">W tym folderze są ${esc(g.o)}, podzielone na podfoldery. Po kliknięciu podfolderu można wgrać albo obejrzeć jego zdjęcia i pliki PDF.</p>
    <div id="foldery">${g.pod.map(l => `<button class="card fold" data-l="${l.k}"><span class="ik"></span>
      <span class="tx"><b>${esc(l.n)}</b><small>${ileP(ile[l.k] || 0)}</small></span><span class="str">›</span></button>`).join('')}</div>`;
  $('#wrocBib').onclick = () => ekranBiblioteki(fid);
  app.querySelectorAll('.fold').forEach(b => b.onclick = () => ekranFolderu(fid, b.dataset.l));
}

async function ekranFolderu(fid, lk, msg, info = true){
  const f = mieszkanie(fid); if (!f) return ekranListy();
  const l = LISCIE[lk];
  app.innerHTML = '<p>Wczytuję pliki…</p>';
  const { data, error } = await sb.from('pliki').select('*').eq('mieszkanie', fid).eq('folder', lk).order('utworzono', { ascending:false });
  const pliki = data || [];
  let linki = {};
  if (pliki.length){
    const { data: u } = await sb.storage.from(SCHOWEK).createSignedUrls(pliki.map(p => p.sciezka), 3600);
    (u || []).forEach(x => { if (x.signedUrl) linki[x.path] = x.signedUrl; });
  }
  app.innerHTML = `${sciezkaFolderu(f, l)}
    <h1>${esc(l.n)}</h1>
    <p class="intro">Tu są ${esc(l.o.replace('{KTO}', kto()))}. ${esc(kto())} klika „Wgraj zdjęcia lub pliki PDF” i wybiera pliki (na telefonie można też od razu zrobić zdjęcie). Po wgraniu plik pojawi się na liście, najnowszy na górze. Po kliknięciu pliku otwiera się jego podgląd; plik można też usunąć.</p>
    ${error ? komunikat(bladPliku(error)) : ''}${msg ? komunikat(msg, info) : ''}
    <label class="btn full wgraj" for="plikiWybor" id="wgraj">+ Wgraj zdjęcia lub pliki PDF</label>
    <input type="file" id="plikiWybor" class="hide" multiple accept="image/jpeg,image/png,image/webp,image/*,application/pdf,.pdf">
    <h2>${pliki.length ? 'Pliki w folderze (' + pliki.length + ')' : 'Pliki w folderze'}</h2>
    ${pliki.length ? `<div class="files" id="lista">${pliki.map(p => `
      <div class="plik" data-id="${p.id}">
        <button class="mini" data-zobacz="${p.id}" aria-label="Zobacz ${esc(p.nazwa)}">${p.typ === 'pdf' ? '<span class="pdf">PDF</span>' : (linki[p.sciezka] ? `<img src="${esc(linki[p.sciezka])}" alt="${esc(p.nazwa)}" loading="lazy">` : '<span class="pdf">ZDJĘCIE</span>')}</button>
        <div class="opis"><b>${esc(p.nazwa)}</b><small>Wgrane: ${czas(p.utworzono)}${p.rozmiar ? ' · ' + wielkosc(p.rozmiar) : ''}</small>
          <div class="acts"><button class="btn" data-zobacz="${p.id}">Zobacz</button><button class="btn2" data-usun="${p.id}">Usuń</button></div></div>
      </div>`).join('')}</div>`
    : `<div class="card empty" id="lista"><b>W tym folderze nie ma jeszcze plików.</b><br>Po kliknięciu „Wgraj zdjęcia lub pliki PDF” można dodać pierwszy.</div>`}`;
  $('#wrocBib').onclick = () => l.grupa ? ekranPodfolderow(fid, l.grupa.k) : ekranBiblioteki(fid);
  app.querySelectorAll('[data-zobacz]').forEach(b => b.onclick = () => podglad(pliki.find(p => p.id === b.dataset.zobacz), linki));
  app.querySelectorAll('[data-usun]').forEach(b => b.onclick = () => ekranUsunPlik(fid, lk, pliki.find(p => p.id === b.dataset.usun)));
  $('#plikiWybor').onchange = e => wgraj(fid, lk, [...e.target.files]);
}

async function zmniejsz(file){
  const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
  const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  const x = c.getContext('2d'); x.fillStyle = '#f4f1ea'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  if (!blob) throw new Error('canvas');
  return (file.type === 'image/jpeg' && file.size <= blob.size) ? file : blob;
}

async function wgraj(fid, lk, files){
  if (!files.length) return;
  const uid = S.user.id; const bledy = []; let ok = 0;
  const pasekW = (i) => { const w = $('#wgraj'); if (w){ w.textContent = `Wgrywam ${i} z ${files.length}…`; w.classList.add('load'); } };
  for (let i = 0; i < files.length; i++){
    pasekW(i + 1);
    const file = files[i];
    const pdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const zdj = !pdf && (file.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name));
    let blob, typ, ext, mime, nazwa = file.name || 'plik';
    if (pdf){
      if (file.size > MAX_PDF){ bledy.push(`${nazwa}: plik jest za duży (najwyżej 20 MB).`); continue; }
      blob = file; typ = 'pdf'; ext = 'pdf'; mime = 'application/pdf';
    } else if (zdj){
      try { blob = await zmniejsz(file); } catch(e){ bledy.push(`${nazwa}: nie da się odczytać tego zdjęcia. Trzeba zapisać je jako JPG i wgrać jeszcze raz.`); continue; }
      typ = 'zdjecie'; ext = 'jpg'; mime = 'image/jpeg'; nazwa = nazwa.replace(/\.[^.]+$/, '') + '.jpg';
    } else { bledy.push(`${nazwa}: to nie jest zdjęcie ani plik PDF.`); continue; }
    const sciezka = `${uid}/${fid}/${lk}/${crypto.randomUUID()}.${ext}`;
    const up = await sb.storage.from(SCHOWEK).upload(sciezka, blob, { contentType:mime, upsert:false });
    if (up.error){ bledy.push(`${nazwa}: ${bladPliku(up.error)}`); continue; }
    const { error } = await sb.from('pliki').insert({ mieszkanie:fid, folder:lk, nazwa, sciezka, typ, rozmiar:blob.size });
    if (error){ await sb.storage.from(SCHOWEK).remove([sciezka]); bledy.push(`${nazwa}: ${bladPliku(error)}`); continue; }
    ok++;
  }
  const txt = (ok ? `Wgrano: ${ileP(ok)}.` : '') + (bledy.length ? (ok ? ' ' : '') + 'Nie wgrano: ' + bledy.join(' ') : '');
  ekranFolderu(fid, lk, txt, !bledy.length);
}

function podglad(p, linki){
  const url = linki[p.sciezka];
  const o = document.createElement('div'); o.className = 'okno'; o.id = 'okno'; o.setAttribute('role', 'dialog');
  o.innerHTML = `<div class="gora"><b>${esc(p.nazwa)}</b><button class="btn2" id="zamknij">Zamknij</button></div>
    <div class="info">Podgląd pliku. Przycisk „Zamknij” wraca do folderu.</div>
    <div class="tresc">${!url ? komunikat('Nie udało się otworzyć pliku. Trzeba zamknąć podgląd i spróbować ponownie.')
      : p.typ === 'pdf' ? `<iframe src="${esc(url)}" title="${esc(p.nazwa)}"></iframe><a class="btn" id="otworzPdf" href="${esc(url)}" target="_blank" rel="noopener">Otwórz PDF w nowej karcie</a>`
      : `<img src="${esc(url)}" alt="${esc(p.nazwa)}" id="duze">`}</div>`;
  document.body.appendChild(o); document.body.style.overflow = 'hidden';
  const zamknij = () => { o.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') zamknij(); };
  document.addEventListener('keydown', esc_);
  $('#zamknij').onclick = zamknij;
}

function ekranUsunPlik(fid, lk, p, msg){
  app.innerHTML = `<div class="narrow" style="margin:auto"><h1>Usunąć plik?</h1>
    <p class="intro">Plik <b>${esc(p.nazwa)}</b> zniknie na stałe z folderu „${esc(LISCIE[lk].n)}”. Tego nie da się cofnąć. Po usunięciu otworzy się znowu folder.</p>
    ${msg ? komunikat(msg) : ''}
    <div class="acts"><button class="btn2" id="nie">Nie, wróć</button><button class="btn" id="tak">Tak, usuń na stałe</button></div></div>`;
  $('#nie').onclick = () => ekranFolderu(fid, lk);
  $('#tak').onclick = async () => {
    $('#tak').disabled = true;
    const r = await sb.storage.from(SCHOWEK).remove([p.sciezka]);
    if (r.error) return ekranUsunPlik(fid, lk, p, bladPliku(r.error));
    const { error } = await sb.from('pliki').delete().eq('id', p.id);
    if (error) return ekranUsunPlik(fid, lk, p, bladPliku(error));
    ekranFolderu(fid, lk, 'Plik ' + p.nazwa + ' został usunięty.');
  };
}

async function ilePlikowMieszkania(fid){
  const { data, error } = await sb.from('pliki').select('id').eq('mieszkanie', fid);
  return error ? 0 : (data || []).length;   // bez Biblioteki w bazie: zero plików; baza i tak nie pozwoli usunąć mieszkania z plikami
}

function ekranUsunZablokowane(f, n){
  app.innerHTML = `<div class="narrow" style="margin:auto"><h1>Najpierw trzeba usunąć pliki</h1>
    <p class="intro">Mieszkania <b>${esc(f.ulica)}</b> nie można teraz usunąć, bo w jego Bibliotece jest ${ileP(n)}. ${esc(kto())} musi najpierw usunąć wszystkie pliki z Biblioteki, a potem usunąć mieszkanie.</p>
    <div class="acts"><button class="btn2" id="nie">Wróć do mieszkania</button><button class="btn" id="doBib">Otwórz Bibliotekę</button></div></div>`;
  $('#nie').onclick = () => ekranMieszkania(f.id);
  $('#doBib').onclick = () => ekranBiblioteki(f.id);
}

start();
</script>
